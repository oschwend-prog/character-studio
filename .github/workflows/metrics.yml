# Pull post metrics from Postiz, every 6 hours (`studio metrics pull`). The windows are catch-up
# windows (a reading is taken once its age is reached; the 7 d one gives up at 14 d and reports the
# post as `abandoned`, exit 0), so a 6-hourly or a skipped run never loses data.
#
# Secrets (repo secrets, added by the owner at go-live): DATABASE_URL, SUPABASE_URL,
# SUPABASE_SERVICE_KEY, POSTIZ_API_KEY. Until DATABASE_URL exists the job prints a notice and
# every later step is skipped, so the schedule never fails (and never emails) before go-live.
# No apt packages are needed here (nothing in this job touches media); if one is ever added, run
# `sudo apt-get update` first, as ci.yml does.
#
# The Postiz CLI is pinned (postiz@2.0.16, see publish.yml): its analytics output is parsed by studio.metrics.
#
# Before the pull, `studio publish confirm` asks Postiz (one `postiz posts:list`) whether the posts it accepted were really published,
# so a post Postiz failed is not pulled for metrics as if it were live. It never fails this job (continue-on-error, and a Postiz
# hiccup exits 0 anyway); publish.yml runs it too, right after every publish run.
#
# After the confirm and before the pull, `studio publish reshare` (owner 2026-10-14) posts, once per London day per Instagram account
# and only between 11:00 and 22:00 London, the Story of the account's most-viewed Reel of the last 14 days (never a second Reel).
# It needs the storage keys (it signs the Story video); it never fails this job (continue-on-error), and a Postiz hiccup exits 0.
#
# After the pull, `studio metrics accounts` (owner 2026-10-15) stores each live account's figures (`postiz analytics:platform -d 7`;
# Stories included, which Postiz cannot report one by one) as one `account_daily` run row per London day, updated in place, for the
# terminal's "Account per day" block. Only reach is per day (details.accounts); views, likes, comments, shares, saves and replies are
# Instagram's one total over the 7-day window, kept on the row of the day it was read (details.window). It never fails this job
# (continue-on-error), and a Postiz hiccup exits 0.
name: metrics

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "secrets not configured — skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '20'
      - name: Install the Postiz CLI
        if: steps.gate.outputs.configured == 'true'
        run: npm i -g postiz@2.0.16
      - name: Confirm what Postiz published
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: uv run studio publish confirm
      - name: Re-share the best recent Reel as a Story
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: uv run studio publish reshare
      - name: Pull metrics
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: uv run studio metrics pull
      - name: Store the accounts' daily totals
        if: steps.gate.outputs.configured == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: uv run studio metrics accounts
