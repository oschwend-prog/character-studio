# Publish due posts through Postiz (`studio publish due`).
#
# Primary trigger: the database. A pg_cron job (migration 0014_publish_timer.sql, `studio-publish-tick`, every 5 minutes)
# sends a repository_dispatch of type `publish` as soon as a post is due (never more than once in 10 minutes, never while the
# kill switch is on). GitHub's own `schedule` is best-effort: on 2026-10-07 it skipped every run between 18:53 and 21:00
# London and the first 19:30 post went out late, so posting no longer depends on it.
#
# Fallback: the schedule below stays, every 15 minutes through the evening posting window (17:00-20:59 UTC), at 11:30 and
# 12:30 UTC for the midday slot, and every 3 hours otherwise, to stay inside GitHub's free minutes (see below). A dispatch
# starts the workflow file of the DEFAULT branch only, so this file must be merged there for the timer to work.
#
# Secrets (repo secrets, added by the owner at go-live): DATABASE_URL, SUPABASE_URL,
# SUPABASE_SERVICE_KEY, POSTIZ_API_KEY. Until DATABASE_URL exists the job prints a notice and
# every later step is skipped, so the schedule never fails (and never emails) before go-live.
# No apt packages are needed here (nothing in this job touches media); if one is ever added, run
# `sudo apt-get update` first, as ci.yml does.
#
# The Postiz CLI is pinned to the exact version go-live was verified with (postiz@2.0.16): its output format
# is what studio.publish.postiz and studio.metrics parse. Bump it deliberately, never `latest`.
name: publish

on:
  schedule:
    # Every 15 minutes through the evening window (Franz 19:00 and Reginald 19:30 London are 18:00 / 18:30
    # UTC in BST and 19:00 / 19:30 UTC in GMT, so 17:00-20:59 UTC covers both with a margin), Lenny's 12:30 London
    # on the dot (11:30 UTC in BST, 12:30 UTC in GMT; the 12:40 catch-up retries it), plus a 3-hourly catch-up for
    # the time the owner picks himself: 26 runs a day, not 96.
    - cron: '*/15 17-20 * * *'
    - cron: '30 11,12 * * *'
    - cron: '40 */3 * * *'
  # Started by the database timer (studio.publish_tick, event_type `publish`); the same job as a scheduled run.
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

# One publisher at a time. A run that is still going when the next tick fires is never cancelled:
# cancelling mid-post is exactly how a post would be left half done. A dispatched run and a scheduled run share this group,
# so they never post in parallel (publish is claim-safe as well: a post is claimed by exactly one runner).
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "secrets not configured — skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '20'
      - name: Install the Postiz CLI
        if: steps.gate.outputs.configured == 'true'
        run: npm i -g postiz@2.0.16
      - name: Publish due posts
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
        run: uv run studio publish due
