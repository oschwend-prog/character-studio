# The weekly review in the cloud (learning plan docs/launch/measurement-and-learning-plan.md, build item 10; plan 4.2 "Weekly (Monday,
# cloud)"): once a week the numbers, the digest the owner reads on the terminal's Today page, the score test, the floors and the proposals
# come from deterministic code (`studio review weekly`, studio/weekly.py): no Claude, no Mac, no browser. The Mac skill
# (.claude/skills/weekly-review) only adds the trend read and the mentions on top, when the owner runs it.
#
# Schedule: 06:15 UTC every Monday = 07:15 London in British Summer Time and 06:15 London in winter (GMT, from the last Sunday of
# October). The run reviews the week that just ended (Monday to Sunday, London), so a late start never changes which week it is.
# GitHub's schedule is best-effort (a run can start late or be skipped): rerun it by hand, a rerun of the same week rewrites that
# week's reviews and logs another run. A manual run: `gh workflow run studio-weekly.yml` (optionally `-f week=2026-W42` or a date).
#
# Steps:
# 1. Job `review` (contents: read): `uv run studio review weekly --out-dir weekly-out`. It applies the binding Instagram guard, saves
#    one review per live character, logs one `weekly` run (the terminal reads it) and, only when a playbook changed or a NEW proposal
#    exists (a hit-rule or hook-arm proposal), writes the files of the proposal into `weekly-out/` (characters/<slug>/playbook.md and
#    docs/weekly/<monday>.md). The files are uploaded as an artifact; the output `propose` says whether there are any.
# 2. Job `propose` (only when `propose` is true): no secret, no database. It copies the files into a checkout of build/slice1, stages
#    only docs/weekly and characters/*/playbook.md, commits them on the branch `weekly/<monday>` as github-actions[bot] (no commit,
#    and no failure, when the files equal the base: a rerun), fetches the branch and pushes it with --force-with-lease, then opens a pull
#    request with the digest as its body, or, when one is already open for the branch, replaces its body (`gh pr edit`). Last it prunes
#    the superseded branches: of the remote `weekly/YYYY-MM-DD` branches it keeps the newest 4 and deletes the older ones that have no
#    open pull request (never another prefix, never the branch of this run, never one whose pull requests could not be checked).
#    Merging that PR is the owner's approval: the rules reach the check only through a merged file. If the repository setting "Allow
#    GitHub Actions to create and approve pull requests" is off (it is today), `gh pr create` fails: the branch is pushed anyway and the
#    step prints the compare link into the run's summary and passes (the terminal's Today card links the same address).
# 3. Job `confirm` (only when the propose job succeeded): `studio review confirm-proposal --run-id <the review's run>` copies the
#    run's pending compare address into `proposal_url`, which is what the Today card links. The review itself stores the address as
#    `proposal_pending_url` only, because the propose job can fail after it and the card must not link a page that does not exist.
#    The job has no write access to the repository.
#
# Secrets (repo secret): DATABASE_URL only, in the three steps that need it (the gate, the review and the proposal link). Until it
# exists the job prints a notice and every later step is skipped, so the schedule never fails (and never emails) before go-live. The
# input `week` reaches the script only through the environment.
name: studio-weekly

on:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to review: an ISO week like 2026-W42 or any date in it (empty: the last finished week)'
        required: false
        default: ''

concurrency:
  group: studio-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      propose: ${{ steps.review.outputs.propose }}
      run_id: ${{ steps.review.outputs.run_id }}
    steps:
      - name: Check secrets
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "secrets not configured — skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.configured == 'true'
      - name: Review the week
        id: review
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          week=()
          if [ -n "${WEEK:-}" ]; then week=(--week "$WEEK"); fi
          uv run studio review weekly --out-dir weekly-out ${week[@]+"${week[@]}"} > "$RUNNER_TEMP/weekly.json"
          cat "$RUNNER_TEMP/weekly.json"
          run_id="$(jq -r '.run_id // empty' "$RUNNER_TEMP/weekly.json" 2>/dev/null || true)"
          if [[ "$run_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then echo "run_id=$run_id" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$(find weekly-out -type f 2>/dev/null | head -n 1)" ]; then
            echo "propose=true" >> "$GITHUB_OUTPUT"
          else
            echo "propose=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the proposal files
        if: steps.gate.outputs.configured == 'true' && steps.review.outputs.propose == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-out
          path: weekly-out
          if-no-files-found: error
          retention-days: 14

  propose:
    needs: review
    if: ${{ !cancelled() && needs.review.outputs.propose == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/slice1
      - uses: actions/download-artifact@v4
        with:
          name: weekly-out
          path: weekly-out
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Superseded weekly/<monday> branches pile up: keep the newest 4 and delete the older ones that have no open pull request.
          # Only branches named weekly/YYYY-MM-DD are ever looked at (never the base branch, never another prefix), the branch pushed
          # in this run is never deleted, and one whose pull requests could not be checked is kept.
          prune_old_weekly_branches() {
            local keep=4 old open
            git ls-remote --heads origin 'refs/heads/weekly/*' \
              | sed -n 's|^.*refs/heads/\(weekly/[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)$|\1|p' | sort -r | tail -n +$((keep + 1)) \
              | while read -r old; do
                if [ "$old" = "$branch" ]; then continue; fi
                if ! open="$(gh pr list --head "$old" --state open --json number --jq 'length' </dev/null)"; then
                  echo "::notice::could not check the pull requests of $old: kept"
                  continue
                fi
                if [ "$open" = "0" ]; then
                  git push origin --delete "refs/heads/$old" </dev/null || echo "::notice::could not delete $old"
                fi
              done
          }
          doc="$(find weekly-out/docs/weekly -name '*.md' | sort | tail -n 1)"
          monday="$(basename "$doc" .md)"
          branch="weekly/$monday"
          compare="https://github.com/${GH_REPO}/compare/build/slice1...${branch}?expand=1"
          cp -R weekly-out/. .
          rm -rf weekly-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/weekly
          if compgen -G 'characters/*/playbook.md' > /dev/null; then git add characters/*/playbook.md; fi
          git diff --cached --quiet || git commit -m "chore: weekly review $monday (playbooks and proposals)"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"
          open_pr="$(gh pr list --head "$branch" --base build/slice1 --state open --json number --jq '.[0].number // empty' || true)"
          if [ -n "$open_pr" ]; then
            if gh pr edit "$open_pr" --body-file "docs/weekly/$monday.md"; then
              echo "pull request #$open_pr is open: its body is updated"
            else
              echo "::notice::pull request #$open_pr is open but its body could not be updated"
            fi
          elif gh pr create --base build/slice1 --head "$branch" --title "Weekly review $monday" --body-file "docs/weekly/$monday.md"; then
            echo "pull request opened for $branch"
          else
            echo "::notice::gh pr create failed (setting off or PR already open? The setting is \"Allow GitHub Actions to create and approve pull requests\"): open it by hand"
            { echo "### Weekly review $monday"; echo; echo "The branch \`$branch\` is pushed. Open the pull request: $compare"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          prune_old_weekly_branches || echo "::notice::pruning the old weekly branches failed: nothing else is affected"

  # Records the pull request link for the terminal's Today card, and only once the branch is on GitHub: the review stores the compare
  # address as pending (the propose job can still fail after the review) and this job, which runs only when the propose job succeeded,
  # makes it the card's link. After the review it is the one place with the database secret; it has no write access to the repository.
  confirm:
    needs: [review, propose]
    if: ${{ !cancelled() && needs.propose.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Record the proposal link
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ needs.review.outputs.run_id }}
        run: |
          set -euo pipefail
          uv run studio review confirm-proposal --run-id "$RUN_ID"
